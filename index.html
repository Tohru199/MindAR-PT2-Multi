
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

    <script> 
      document.addEventListener("DOMContentLoaded", function() {
    const sceneEl = document.querySelector('a-scene');
  sceneEl.addEventListener("loaded", function () {
        console.log("¡Escena cargada!");
      });

  const chattini = document.querySelector('#chattini');
  const chiikawa = document.querySelector('#chiikawa');
  const usagi = document.querySelector('#usagi');
  const all = document.querySelector('#all');

  chattini.addEventListener("mouseenter", event => {
  console.log("mouse sobre CHATTINI");
});
  chattini.addEventListener("click", event => {
  console.log("chattini click");
  });
  chiikawa.addEventListener("click", event => {
  console.log("chiikawa click");
  });
  usagi.addEventListener("mouseenter", event => {
  console.log("mouse sobre USAGI");
});
  usagi.addEventListener("click", event => {
  console.log("usagi click");
  });
  all.addEventListener("click", event => {
  console.log("all click");
  });

  });
  </script>
  </head>

  
  <body>

    <a-scene mindar-image="imageTargetSrc: ./markerc.mind; maxTrack: 4" color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
      <a-assets>
        
        <a-asset-item id="chattiniModel" src="./Chattini.glb"></a-asset-item>
        <a-asset-item id="ChiikawaModel" src="./chiikawa.glb"></a-asset-item>
        <a-asset-item id="UsagiModel" src="./usagi.glb"></a-asset-item>
        <a-asset-item id="ALLModel" src="./chiikawasitos.glb"></a-asset-item>
      </a-assets>


      
      <a-camera position="0 0 0" look-controls="enabled: false" cursor="fuse: false; rayOrigin: mouse;" raycaster="far: 10000; objects: .clickable" ></a-camera>


      
      <a-entity mindar-image-target="targetIndex: 0">
       <a-gltf-model id="chattini" class="clickable" rotation="0 0 0 " position="0 0 0.1" scale="1 1 1" src="#chattiniModel" animation="property: position; to: 0 0.1 0.1; dur: 1000; easing: easeInOutQuad; loop: true; dir: alternate"></a-gltf-model>
      </a-entity>
      
      <a-entity mindar-image-target="targetIndex: 1">
       <a-gltf-model id="chiikawa" class="clickable" rotation="0 0 0 " position="0 0 0.1" scale="0.3 0.3 0.3" src="#ChiikawaModel" animation="property: position; to: 0 0.1 0.1; dur: 1000; easing: easeInOutQuad; loop: true; dir: alternate"></a-gltf-model>
      </a-entity>
      
      <a-entity mindar-image-target="targetIndex: 2">
       <a-gltf-model id="usagi" class="clickable" rotation="0 180 0 " position="0 0 0.1" scale="0.5 0.5 0.5" src="#UsagiModel" animation="property: position; to: 0 0.1 0.1; dur: 1000; easing: easeInOutQuad; loop: true; dir: alternate"></a-gltf-model>
      </a-entity>
      
      <a-entity mindar-image-target="targetIndex: 3">
       <a-gltf-model id="all" class="clickable" rotation="0 180 0 " position="1 0 0.1" scale="1 1 1" src="#ALLModel" animation="property: position; to: 0 0.1 0.1; dur: 1000; easing: easeInOutQuad; loop: true; dir: alternate"></a-gltf-model>
      </a-entity>
    </a-scene>
  </body>
</html>
